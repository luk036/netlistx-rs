[package]
name = "netlistx-rs"
version = "0.1.5"
edition = "2021"
rust-version = "1.70"
description = "Netlist (hypergraph) in Rust"
repository = "https://github.com/luk036/netlistx-rs"
license = "MIT OR Apache-2.0"
keywords = ["netlist", "hypergraph", "eda", "vlsi", "partitioning"]
categories = ["science", "algorithms", "data-structures"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "src/doc-header.html"]

[dependencies]
petgraph = "0.8.2"
indexmap = { version = "2.2", features = ["serde"] }
thiserror = "2.0.18"
rand = "0.10.1"
serde_json = "1.0.150"

[features]
default = []
serde = ["indexmap/serde", "petgraph/serde"]
rayon = ["dep:rayon"]
cuda = ["dep:cudarc"]
proptest = ["dep:proptest"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.rayon]
version = "1.8"
optional = true

[dependencies.cudarc]
version = "0.12"
optional = true
default-features = false
features = ["driver", "nvrtc", "cuda-12030"]

[dependencies.proptest]
version = "1"
optional = true

[dev-dependencies]
num-rational = "0.4.2"
criterion = "0.8.2"
proptest = "1"
tempfile = "3.10"
netlistx-rs = { path = ".", features = ["proptest"] }

[[bench]]
name = "yosys_json_bench"
harness = false

[[bench]]
name = "netlist_bench"
harness = false

[[bench]]
name = "netlist_benchmark"
harness = false

[profile.bench]
debug = true
